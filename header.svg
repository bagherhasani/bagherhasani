<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="Baker Hassani">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="78%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earthLit" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#245a8f"/>
      <stop offset="45%" stop-color="#0c1c30"/>
      <stop offset="100%" stop-color="#050910"/>
    </radialGradient>
    <clipPath id="earth">
      <circle cx="972" cy="122" r="72"/>
    </clipPath>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9cdcff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="brainGlow">
      <stop offset="0%" stop-color="#7dff9a" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="2" fill="#3dff7a" opacity="0.08"/>
    </pattern>
    <clipPath id="lcd">
      <rect x="703" y="193" width="64" height="54" rx="4"/>
    </clipPath>
  </defs>

  <rect width="1100" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1100" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1100" height="340" rx="18" fill="url(#vignette)"/>

  <path d="M22 48 V22 H48" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M1078 48 V22 H1052" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M22 292 V318 H48" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <path d="M1078 292 V318 H1052" fill="none" stroke="#58a6ff" stroke-width="2"/>

  <text x="52" y="96" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Computer science student</text>
  <text x="52" y="118" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">@ University of Tulsa</text>
  <text x="52" y="176" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">Baker Hassani</text>
  <text x="52" y="204" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">linux  |  python  |  c++  |  go</text>

  <!-- stars -->
  <g fill="#f0f6fc">
    <circle cx="540" cy="46" r="1.4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="72" r="1.1">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="80" r="1.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M568 88 l1.8 4.4 4.6.2 -3.6 2.8 1.4 4.4 -4.2-2.6 -4.2 2.6 1.4-4.4 -3.6-2.8 4.6-.2 z" fill="#58a6ff" opacity="0.8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M1048 200 l1.4 3.2 3.4.2 -2.6 2 1 3.2 -3.2-2 -3.2 2 1-3.2 -2.6-2 3.4-.2 z" fill="#79c0ff">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- push from laptop to globe -->
  <path id="push1" d="M770 168 C860 70 910 48 948 70" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path id="push2" d="M770 180 C900 110 940 100 972 110" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="4 9" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path id="push3" d="M770 192 C880 150 930 140 958 128" fill="none" stroke="#a371f7" stroke-width="1.2" stroke-dasharray="3 8" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.9s" repeatCount="indefinite"/>
  </path>
  <circle r="3.4" fill="#79c0ff" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath xlink:href="#push1"/></animateMotion>
  </circle>
  <circle r="2.8" fill="#3fb950" filter="url(#glow)">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath xlink:href="#push2"/></animateMotion>
  </circle>
  <circle r="2.4" fill="#d2a8ff">
    <animateMotion dur="3.1s" repeatCount="indefinite"><mpath xlink:href="#push3"/></animateMotion>
  </circle>

  <!-- globe + rings -->
  <g>
    <ellipse cx="972" cy="122" rx="102" ry="30" fill="none" stroke="#58a6ff" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" values="-16 972 122;344 972 122" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="972" cy="122" rx="88" ry="22" fill="none" stroke="#a371f7" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 12">
      <animateTransform attributeName="transform" type="rotate" values="20 972 122;-340 972 122" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="972" cy="122" r="86" fill="#58a6ff" opacity="0.07"/>
    <circle cx="972" cy="122" r="72" fill="url(#earthLit)"/>
    <g clip-path="url(#earth)">
      <ellipse cx="942" cy="112" rx="30" ry="20" fill="#1a4a73"/>
      <ellipse cx="1000" cy="136" rx="26" ry="18" fill="#163d61"/>
      <ellipse cx="968" cy="92" rx="16" ry="12" fill="#1e567f"/>
      <ellipse cx="958" cy="154" rx="22" ry="10" fill="#12344f"/>
      <ellipse cx="972" cy="122" rx="24" ry="72" fill="none" stroke="#79c0ff" stroke-opacity="0.2"/>
      <ellipse cx="972" cy="122" rx="48" ry="72" fill="none" stroke="#79c0ff" stroke-opacity="0.12"/>
      <line x1="900" y1="122" x2="1044" y2="122" stroke="#79c0ff" stroke-opacity="0.14"/>
      <line x1="900" y1="98" x2="1044" y2="98" stroke="#79c0ff" stroke-opacity="0.08"/>
      <line x1="900" y1="146" x2="1044" y2="146" stroke="#79c0ff" stroke-opacity="0.08"/>
      <circle cx="938" cy="108" r="2.6" fill="#58a6ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="992" cy="128" r="2.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="148" r="2.2" fill="#79c0ff">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1008" cy="104" r="2" fill="#f0f6fc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="90" r="1.8" fill="#d2a8ff">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <circle cx="972" cy="122" r="72" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <path id="g1" d="M910 96 Q972 36 1034 104" fill="none" stroke="#79c0ff" stroke-width="1.8" opacity="0.9"/>
    <path id="g2" d="M904 148 Q972 214 1040 132" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.75"/>
    <path id="g3" d="M920 78 Q1010 122 1030 168" fill="none" stroke="#a371f7" stroke-width="1.4" opacity="0.7"/>
    <circle r="3.2" fill="#79c0ff" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite"><mpath xlink:href="#g1"/></animateMotion>
    </circle>
    <circle r="2.7" fill="#3fb950" filter="url(#glow)">
      <animateMotion dur="3.4s" repeatCount="indefinite"><mpath xlink:href="#g2"/></animateMotion>
    </circle>
    <circle r="2.5" fill="#d2a8ff">
      <animateMotion dur="3.9s" repeatCount="indefinite"><mpath xlink:href="#g3"/></animateMotion>
    </circle>
  </g>

  <!-- chair, reclined -->
  <g transform="rotate(-16 608 272)">
    <rect x="592" y="168" width="18" height="112" rx="8" fill="#21262d"/>
    <rect x="592" y="268" width="84" height="12" rx="5" fill="#2d333b"/>
    <rect x="604" y="280" width="7" height="16" rx="2" fill="#161b22"/>
    <rect x="652" y="280" width="7" height="16" rx="2" fill="#161b22"/>
  </g>

  <!-- kid leaning back -->
  <g transform="rotate(-18 640 268)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 1.5; 0 0" dur="3s" repeatCount="indefinite" additive="sum"/>

    <!-- brain glow: thinking, not fire -->
    <circle cx="654" cy="158" r="62" fill="url(#brainGlow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="54;66;54" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="654" cy="158" r="48" fill="none" stroke="#7dff9a" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" values="0 654 158;360 654 158" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="654" cy="158" r="40" fill="none" stroke="#79c0ff" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 12">
      <animateTransform attributeName="transform" type="rotate" values="360 654 158;0 654 158" dur="14s" repeatCount="indefinite"/>
    </circle>
    <path id="thought" d="M654 158 m-50,0 a50,36 0 1,1 100,0 a50,36 0 1,1 -100,0" fill="none"/>
    <circle r="2.4" fill="#7dff9a">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#thought"/></animateMotion>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#79c0ff">
      <animateMotion dur="8s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#thought"/></animateMotion>
    </circle>
    <circle r="1.7" fill="#f0f6fc">
      <animateMotion dur="7s" begin="3s" repeatCount="indefinite"><mpath xlink:href="#thought"/></animateMotion>
    </circle>
    <rect x="608" y="256" width="62" height="14" rx="7" fill="#1c2128"/>
    <path d="M618 214 C618 200 632 192 650 194 C670 196 682 208 682 222 L676 264 L616 264 C612 246 612 226 618 214 Z" fill="#1f6feb"/>
    <path d="M650 194 C664 196 676 208 676 222 L672 262 L650 262 Z" fill="#165db8"/>
    <line x1="652" y1="212" x2="656" y2="248" stroke="#79c0ff" stroke-width="1.6" stroke-linecap="round"/>

    <!-- black hair: straight with a little curl, no pigtails -->
    <path d="M612 176
             C614 132 636 118 656 118
             C678 118 700 132 702 176
             C700 186 694 190 686 184
             C678 158 662 150 656 150
             C648 150 632 158 624 184
             C618 190 612 186 612 176 Z" fill="#141414"/>
    <!-- wavy bangs -->
    <path d="M630 148 C636 162 642 168 638 176 C634 166 630 158 630 148 Z" fill="#0e0e0e"/>
    <path d="M648 144 C656 160 660 170 654 176 C650 164 648 154 648 144 Z" fill="#0e0e0e"/>
    <path d="M666 146 C674 160 678 168 674 176 C668 162 666 154 666 146 Z" fill="#0e0e0e"/>
    <!-- slight curl at the sides, still on the head -->
    <path d="M616 168 C610 178 614 192 622 196 C618 184 618 174 616 168 Z" fill="#121212"/>
    <path d="M696 166 C704 176 702 192 694 196 C698 184 698 174 696 166 Z" fill="#121212"/>

    <circle cx="654" cy="186" r="36" fill="#c9956b"/>
    <ellipse cx="636" cy="198" rx="7" ry="3.4" fill="#e39b7a" opacity="0.5"/>
    <ellipse cx="680" cy="198" rx="7" ry="3.4" fill="#e39b7a" opacity="0.5"/>
    <circle cx="620" cy="186" r="6.5" fill="#b8835c"/>
    <circle cx="690" cy="184" r="6" fill="#b8835c"/>
    <path d="M618 170 C616 182 622 192 628 194 C624 182 622 174 618 170 Z" fill="#141414"/>
    <path d="M690 168 C694 180 690 192 684 194 C688 182 690 174 690 168 Z" fill="#141414"/>

    <g>
      <rect x="622" y="176" width="34" height="26" rx="8" fill="url(#lens)" stroke="#0d1117" stroke-width="4"/>
      <rect x="660" y="176" width="34" height="26" rx="8" fill="url(#lens)" stroke="#0d1117" stroke-width="4"/>
      <path d="M656 188 H660" stroke="#0d1117" stroke-width="4" stroke-linecap="round"/>
      <path d="M622 188 Q606 182 608 172" fill="none" stroke="#0d1117" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M694 188 Q710 182 706 172" fill="none" stroke="#0d1117" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="628" y="181" width="8" height="4" rx="1.5" fill="#f0f6fc" opacity="0.85">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="666" y="181" width="8" height="4" rx="1.5" fill="#f0f6fc" opacity="0.85">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <ellipse cx="640" cy="190" rx="5" ry="5" fill="#0d1117">
      <animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.2;0.22;0.24;1" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="678" cy="190" rx="5" ry="5" fill="#0d1117">
      <animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.2;0.22;0.24;1" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="642" cy="188" r="1.6" fill="#f0f6fc"/>
    <circle cx="680" cy="188" r="1.6" fill="#f0f6fc"/>
    <path d="M648 208 Q656 213 664 208" fill="none" stroke="#8a5a3a" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- desk -->
  <rect x="580" y="262" width="360" height="11" rx="4" fill="#3d444d"/>
  <rect x="580" y="262" width="360" height="3" rx="2" fill="#58a6ff" opacity="0.35"/>
  <rect x="596" y="273" width="12" height="36" fill="#21262d"/>
  <rect x="916" y="273" width="12" height="36" fill="#21262d"/>

  <!-- bent arms: sleeve, elbow, forearm into the hands -->
  <g stroke-linecap="round" fill="none">
    <line x1="668" y1="232" x2="696" y2="246" stroke="#1f6feb" stroke-width="15"/>
    <line x1="694" y1="245" x2="714" y2="251" stroke="#c9956b" stroke-width="11"/>
    <line x1="672" y1="238" x2="708" y2="248" stroke="#1f6feb" stroke-width="16"/>
    <line x1="705" y1="247" x2="744" y2="251" stroke="#c9956b" stroke-width="12"/>
  </g>

  <!-- laptop: phosphor terminal -->
  <g>
    <circle cx="735" cy="220" r="48" fill="url(#phosphor)"/>
    <rect x="698" y="188" width="74" height="62" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.6"/>
    <rect x="703" y="193" width="64" height="54" rx="4" fill="#03140a"/>
    <g clip-path="url(#lcd)">
      <rect x="703" y="193" width="64" height="54" fill="url(#scan)"/>
      <text x="710" y="206" fill="#3dff7a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7">$</text>
      <rect x="718" y="200" height="6" rx="1" fill="#3dff7a">
        <animate attributeName="width" values="0;28;28;0" keyTimes="0;0.45;0.8;1" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="710" y="212" height="5" rx="1" fill="#2ea043">
        <animate attributeName="width" values="0;0;36;36;0" keyTimes="0;0.2;0.55;0.85;1" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="710" y="222" height="5" rx="1" fill="#56d364">
        <animate attributeName="width" values="0;0;0;22;22" keyTimes="0;0.4;0.6;0.85;1" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="710" y="232" width="5" height="8" fill="#7dff9a">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="686" y="249" width="92" height="13" rx="3" fill="#21262d" stroke="#30363d"/>
    <g>
      <rect x="698" y="252" width="10" height="7" rx="1.5" fill="#30363d"/>
      <rect x="710" y="252" width="10" height="7" rx="1.5" fill="#30363d">
        <animate attributeName="fill" values="#30363d;#3dff7a;#30363d;#30363d" keyTimes="0;0.12;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="722" y="252" width="10" height="7" rx="1.5" fill="#30363d"/>
      <rect x="734" y="252" width="10" height="7" rx="1.5" fill="#30363d">
        <animate attributeName="fill" values="#30363d;#30363d;#3dff7a;#30363d;#30363d" keyTimes="0;0.45;0.55;0.65;1" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="746" y="252" width="10" height="7" rx="1.5" fill="#30363d"/>
      <rect x="758" y="252" width="10" height="7" rx="1.5" fill="#30363d"/>
    </g>
  </g>

  <!-- compact hands on the keys, top-down, no noodle arms -->
  <g fill="#c9956b">
    <!-- left -->
    <g transform="translate(714,251)">
      <path d="M-9,-5 C-11,-9 9,-9 9,-5 L10,3 C8,7 -8,7 -10,3 Z"/>
      <ellipse cx="-11" cy="0" rx="3.4" ry="2.3" transform="rotate(-38 -11 0)"/>
      <circle cx="-6" cy="8" r="2.5"/>
      <circle cx="-1.5" cy="9" r="2.6"/>
      <circle cx="3" cy="9" r="2.6"/>
      <circle cx="7.2" cy="8" r="2.4"/>
    </g>
    <!-- right, one slow tap -->
    <g transform="translate(744,251)">
      <path d="M-9,-5 C-11,-9 9,-9 9,-5 L10,3 C8,7 -8,7 -10,3 Z"/>
      <ellipse cx="11" cy="0" rx="3.4" ry="2.3" transform="rotate(38 11 0)"/>
      <circle cx="-6" cy="8" r="2.5"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 1; 0 0; 0 0" keyTimes="0;0.1;0.22;1" dur="1.8s" repeatCount="indefinite"/>
        <circle cx="-1.5" cy="9" r="2.6"/>
      </g>
      <circle cx="3" cy="9" r="2.6"/>
      <circle cx="7.2" cy="8" r="2.4"/>
    </g>
  </g>

  <!-- coffee bigger than the baby torso on purpose -->
  <g transform="translate(838,218)">
    <rect x="0" y="16" width="30" height="30" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.3"/>
    <rect x="4" y="21" width="22" height="16" rx="3" fill="#7a431e"/>
    <ellipse cx="15" cy="23" rx="9" ry="3" fill="#c9783a" opacity="0.7"/>
    <path d="M30 24 C42 24 42 40 30 42" fill="none" stroke="#8b949e" stroke-width="2.4"/>
    <g fill="none" stroke="#c9d1d9" stroke-width="1.6" stroke-linecap="round">
      <path d="M8 10 C8 4 14 4 14 -2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M16 12 C16 6 22 6 22 0">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M22 9 C22 4 26 4 26 -1">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
